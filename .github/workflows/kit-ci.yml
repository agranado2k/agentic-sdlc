name: Kit CI

# The kit's OWN gate. It is not the gate a bootstrapped project inherits —
# bootstrap.sh deletes this file, because a fresh project has no business
# running the kit's acceptance test against the kit's shared layer.
#
# Ten jobs. The first five are the kit's own foundations, in increasing order
# of what they'd cost you to learn late; the rest each check one artifact the
# kit ships to its consumers.
#
#   1. harness      the docs-conformance validators' fixture tests. If these are
#                   red, every downstream green is meaningless.
#   2. portability  the PRD's success criterion, run as a check rather than
#                   asserted in prose: "no product vocabulary in the core — the
#                   kit runs the portability validator against ITS shared layer
#                   in CI". `index.mjs .` at the kit root does that, and since
#                   the kit self-hosts its own constitution (docs/adr/0001-…) it
#                   now does MORE: the root AGENTS.md is real, so the same run
#                   also resolves the kit manual's commands and paths, checks
#                   the two shims, and holds every article reachable. The
#                   portability deny-list still lands on the two shared
#                   articles, which is the criterion this job is named for.
#   3. self-host    the whole docs gate at the kit's own root — `check.sh`, not
#                   just the harness — plus the suite that proves bootstrap
#                   still strips the kit's own files. Job 2 runs one engine over
#                   the manual layer; this one runs the gate a consumer runs,
#                   against the repo that ships it. A framework whose own repo
#                   cannot pass its own gate is selling a rule it does not keep.
#   4. demo         the end-to-end acceptance test: build a throwaway project
#                   from this tree, bootstrap it, and prove the gate green — and
#                   then prove it red, once per failure mode it claims to catch.
#   5. docs-demo    the other acceptance surface: the stamped docs set is
#                   personalized, and BOTH halves of the UPDATING.md recipe run
#                   end to end against the pinned transcripts UPDATING.md
#                   quotes. Until 2026-08-27 this suite had no job here, so the
#                   byte-for-byte transcript check gating UPDATING.md was
#                   local-only — tests/self-host.test.sh section F now fails if
#                   any suite loses its job again.
#   6. skills       the /implement delivery contract, checked as text.
#   7. workflow-templates
#                   the workflow templates parse, and install inert.
#   8. adapters     the adapter trees are well-formed and stay dormant.
#   9. exclusions   the deliberate-exclusions record has not gone stale — every
#                   skill it says the kit does not ship is really not shipped.
#  10. dogfood-optin
#                   the one OPTIONAL skill, both ways: bootstrap with it, without
#                   it, and with no terminal to ask on. Job 4 only ever sees the
#                   first of those, and the failure mode worth catching lives in
#                   the second — a declined skill that left a row behind.
#
# The guard scripts and the capability-tier resolver have their own file
# (kit-guards.yml) — separate work streams do not collide on one YAML.
#
# Node is used here without apology: this is the kit's own repo, and the harness
# is the one part of the framework that has a runtime. A consumer project that
# never installs node still gets a working gate (scripts/check.sh's POSIX
# fallback) — job 3 exercises that path too.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  harness:
    name: Harness fixture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The harness is dependency-free plain ESM, so there is no install step.
      - name: Validator fixture tests
        run: node --test scripts/docs-conformance/test/*.test.mjs

  portability:
    name: Shared layer is portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Portability validator against the kit's own shared layer
        run: node scripts/docs-conformance/index.mjs .

  self-host:
    name: The kit passes its own gate
    runs-on: ubuntu-latest
    steps:
      # Full-depth checkout, because F3 asks whether the declared shared layer
      # has its release tag. fetch-tags alone is NOT enough: at the default
      # depth of 1 it fetches the tag REF but not its target commit whenever
      # the tag sits behind the tip, so peeling fails and F3 false-alarms
      # "NO tag" on every commit after the tagged one — observed live on the
      # first post-tag push. Depth 0 fetches the history the tag points into.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The gate itself, at the kit root — the same invocation the pre-push hook
      # makes and the same one a consumer inherits. Node is present, so this is
      # the full harness; the suite below also runs it with DOCS_CHECK_NO_NODE=1
      # to cover the POSIX fallback a consumer without a runtime would get.
      - name: Docs gate at the kit root
        run: sh scripts/check.sh
      # And the other half of self-hosting: bootstrap must still strip the kit's
      # own files, so a consumer's stamped project is byte-identical to what it
      # was before the kit had any. That claim is only worth having as a check —
      # a leak here would ride into every project made from the template.
      - name: Self-host acceptance test
        run: sh tests/self-host.test.sh

  demo:
    name: Bootstrap demo (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kit acceptance test
        run: sh tests/kit-demo.sh

  docs-demo:
    name: Docs set + UPDATING recipe (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # zsh is INSTALLED rather than hoped for. The suite's C4d case runs
      # UPDATING.md's 9b block through a real zsh, because zsh's history
      # modifiers on `"$REF:literal"` are the whole of the second data-loss bug
      # 0.10.0 fixes — and the case skips loudly (it does not fail) on a host
      # without one. A loud skip is right for an operator's laptop and wrong
      # here: this job is the only place that proof is compulsory, and a runner
      # image that quietly drops zsh would retire the case without anyone
      # deciding to. `apt-get` because the shell is a runner package, not a
      # project dependency.
      - name: Install zsh (C4d runs the recipe through it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      # The suite bootstraps throwaway consumers and runs the gate on them, so
      # it needs the same node the demo job does. Its load-bearing half is the
      # byte-for-byte comparison of UPDATING.md's two worked-example transcripts
      # against a live re-run of the recipe — the check that catches a
      # shared-layer wave whose transcripts were spliced by hand.
      - name: Docs + updating acceptance test
        run: sh tests/docs-demo.sh

  skills:
    name: /implement delivery contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No node, no forge: the skills are documents, and this checks the one
      # whose text now drives a push, a PR and a review request. What it cannot
      # reach — `gh pr create` against a live forge, a review workflow firing —
      # is named in the script's own header rather than mocked.
      - name: Skill text consistency
        run: sh tests/implement-deliver.test.sh

  workflow-templates:
    name: Workflow templates parse, and install inert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PyYAML is preinstalled on ubuntu-latest, so the parse leg really runs
      # here. The script degrades to structural checks (and says so) on a
      # machine with no YAML parser, because the kit's core has no runtime.
      - name: AI review template acceptance test
        run: sh tests/ai-review-template.test.sh

  adapters:
    name: Adapters are well-formed and dormant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Nothing under adapters/ runs in this repo, and the kit has no Node
      # project to run it against — which is exactly why the tree needs a check.
      # This asserts what CAN be asserted from here: every shell file parses,
      # every module parses, the config examples really set what the guards
      # read, and bootstrap leaves the whole tree byte-identical and inert.
      # What it cannot assert is listed in adapters/node-ts/INSTALL.md.
      - name: Adapters acceptance test
        run: sh tests/adapters-demo.sh

  exclusions:
    name: Exclusions record is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No node: the record is a document, and the check is a comparison
      # between what it claims and what `.agents/skills/` actually contains.
      # The reason it runs in CI rather than only locally is that it goes stale
      # by someone ADDING a skill — an action taken in a pull request that has
      # no reason to think about EXCLUSIONS.md at all.
      - name: Deliberate-exclusions record
        run: sh tests/exclusions.test.sh

  dogfood-optin:
    name: The optional skill, both ways
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node IS needed here, unlike the exclusions job: the load-bearing check
      # plants a `/dogfood` reference into the tree that declined the skill and
      # requires the real validator to report `skill-missing`. A grep can show
      # the reference is absent; only the harness can show the gate would have
      # caught it if it were not.
      - name: Opt-in /dogfood acceptance test
        run: sh tests/dogfood-optin.test.sh

  setup-demo:
    name: One-line agent setup (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The suite executes SETUP.md's and setup/agent-bootstrap.md's own fenced
      # blocks against a scratch origin — node so the produced project's docs
      # gate runs the full harness rather than the POSIX fallback.
      - name: Setup docs referee
        run: sh tests/setup-demo.sh

  review-output:
    name: /review-pr output contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Output-contract skill-text suite
        run: sh tests/review-pr-output.test.sh

  gate-advisory:
    name: An advisory is audible through the gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Advisory-visibility suite
        run: sh tests/docs-gate-advisory.test.sh

  design-brief:
    name: /design-brief contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design-brief skill-text suite
        run: sh tests/design-brief-skill.test.sh

  housekeeping:
    name: /housekeeping contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Housekeeping skill-text suite
        run: sh tests/housekeeping-skill.test.sh

  manifest:
    name: The manifest grammar, once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest parser suite
        run: sh tests/manifest.test.sh

  adopt-demo:
    name: Existing-repo adoption arm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The fixture repo's own docs gate must go green at the end of a clean
      # adoption — node so that run is the full harness, not the fallback.
      - name: Adoption referee
        run: sh tests/adopt-demo.sh
