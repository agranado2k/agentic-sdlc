name: Docs gate

# The CI half of the docs gate. `.githooks/pre-push` runs the same
# scripts/check.sh before every push, with a loud PUSH_WITHOUT_DOCS=1 hatch —
# this job is what makes that hatch a DEFERRAL rather than an override. One
# rule, two callers; nothing here re-implements the gate.
#
# No install step, no runtime: the gate is POSIX sh and git. That is the whole
# reason a freshly created project can run it on day one, before it has chosen
# a language.
#
# JUDGED BY THE BASE'S CONFIG. The step sets POLICY_BASE to the PR's base
# commit, so the gate reads scripts/docs-conformance/config.mjs (and the
# local-vocabulary module beside it) as the base has it, through
# scripts/policy.sh: a PR cannot exempt its own violation in the same diff. A
# base with no readable gate config fails the job rather than passing it. The
# full-history checkout is what puts the base commit in reach.
#
# TEMPLATE. bootstrap.sh copies this into .github/workflows/ of YOUR project.
# The kit itself does not run it (a template repo running its consumers' CI on
# itself would be gating the wrong tree); the kit's own CI is
# .github/workflows/kit-guards.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  docs-gate:
    name: Docs gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the docs gate
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha }}
        run: sh scripts/check.sh
