# Evidence behind D-02. One entry per source; `claim` is what we take from it.
# Every page was read through a restricted reader on 2026-10-23, via a summarising fetch tool:
# quotes in research.md are near-verbatim and are checked against the page before a record cites them.

# --- The operator's sources (phase 2) ---
- id: S-1
  url: https://www.tenex.co/blog/building-an-ai-native-sdlc
  title: Building an AI-Native SDLC (Lieberman, Zakon, Hess, Hezarkhani; Tenex, 2026-08-05)
  kind: operator
  read: 2026-10-23
  claim: >-
    Treat project context as code: a versioned record beside the code, machine-owned fenced regions,
    status derived from the record and "done" gated on linked evidence. Lessons compound into checks
    and skills. No outcome data; consultancy framing.
- id: S-2
  url: https://tessl.io/blog/we-stopped-reviewing-code-and-started-verifying-intent
  title: We stopped reviewing code and started verifying intent (Ankit Jain, Aviator; Tessl blog, 2026-10-20)
  kind: operator
  read: 2026-10-23
  claim: >-
    Humans review acceptance criteria before code exists; each criterion becomes a contract with a
    deterministic verdict and attached evidence; recurring review comments are mined into
    machine-enforced invariants. One number (4x PR volume); vendor author.
- id: S-3
  url: https://hamel.dev/blog/posts/decision-model-evals
  title: How To Use Decision Models for Evals (Hamel Husain, Antaripa Saha; 2026-10-20)
  kind: operator
  read: 2026-10-23
  claim: >-
    Treat any automated judge as a classifier: set a precision/recall floor from the consequences,
    tune its threshold by cross-validation, compare on a cost Pareto frontier, check calibration,
    one judge per failure mode. n=98 traces, one domain.
- id: S-4
  url: https://blog.exe.dev/topology
  title: The Topology of an LLM Agent Loop With Tool Use (Philip Zeyliger; exe.dev, 2026-10-20)
  kind: operator
  read: 2026-10-23
  claim: >-
    An agent is model, loop and tools; where each runs decides privacy, cost, capability and blast
    radius. VMs are the safest place to run tools; map where credentials live. Descriptive, no
    measurement; author sells VMs.
- id: S-5
  url: https://www.latent.space/p/claude-mods
  title: "Claude Mods: Flipping the Harness Inside Out (Dan McAteer; Latent Space, 2026-10-21)"
  kind: operator
  read: 2026-10-23
  claim: >-
    In-process harness middleware (mods) turns the harness toward the human's attention: side-agent
    supervisors, guards that hold a tool call. Costs: noise (99 of 111 turns triggered), tokens, and
    mods are not sandboxed. One practitioner's evidence.

# --- One hop from the operator's sources (phase 2) ---
- id: S-6
  url: https://latent.space/p/reviews-dead
  title: How to Kill the Code Review (Ankit Jain; Latent Space, 2026-03-02)
  kind: literature
  read: 2026-10-23
  claim: >-
    A five-layer "Swiss cheese" in place of approval review: parallel candidates ranked by
    verification, deterministic guardrails, human-written BDD criteria, path-based escalation
    (auth, schema, dependencies), adversarial verifiers. Opinion; cites Faros second-hand.
- id: S-7
  url: https://parlance-labs.com/blog/posts/auto-evals/
  title: Do Automated Evals Work? (Saha, Husain; Parlance Labs, 2026-07-11)
  kind: literature
  read: 2026-10-23
  claim: >-
    Six automated error-analysis systems reached 74-87% recall against a human expert, and all
    missed failures that "looked correct" but missed the product goal. A human-in-the-loop taxonomy
    loop is recommended.
- id: S-8
  url: https://randalolson.com/2026/10/14/when-to-use-a-decision-model-instead-of-an-llm/
  title: When to use a decision model instead of an LLM (Randal S. Olson, 2026-10-15)
  kind: literature
  read: 2026-10-23
  claim: >-
    Decision models match LLMs on routing and safety classification at a fraction of the cost and
    latency, and trail them by 19-30 points on reasoning and knowledge.
- id: S-9
  url: https://code.claude.com/docs/en/plugins/mods/overview
  title: Mods overview (Anthropic, Claude Code docs, undated)
  kind: literature
  read: 2026-10-23
  claim: >-
    Mods run in-process, are not sandboxed, and without managed settings a mod's approval can pass a
    tool call that ask rules or PreToolUse hooks would hold.
- id: S-10
  url: https://blog.exe.dev/revisiting-joel
  title: Revisiting Joel's Test (Philip Zeyliger; exe.dev, 2026-08-31)
  kind: literature
  read: 2026-10-23
  claim: >-
    A nine-point test for agent-era teams: adversarial cross-model review, agent-supervised deploys
    that can halt, a merge queue under 3 minutes, observability agents can query.
- id: S-11
  url: https://blog.philz.dev/blog/sandboxes/
  title: "computing 2+2: so many sandboxes (philz.dev, 2026-03-29)"
  kind: literature
  read: 2026-10-23
  claim: A ladder of sandboxes by job, from microVM for a coding agent to WASM for a data agent.
- id: S-12
  url: https://www.latent.space/p/attention-interface
  title: The Evolution of the Agent Harness (Dan McAteer; Latent Space, 2026-08-22)
  kind: literature
  read: 2026-10-23
  claim: >-
    As models absorb the harness, what remains faces the human: a policy for when the agent may
    interrupt and what it decides alone, learned from corrections.
- id: S-13
  url: https://github.com/DannyMac180/skills/tree/main/modsmith
  title: ModSmith README (DannyMac180, undated)
  kind: literature
  read: 2026-10-23
  claim: >-
    Mods including a next-steps supervisor and an assumption ledger, a static cost audit per mod, and
    a DECISIONS.md per mod; only two run live.
- id: S-14
  url: https://cursor.com/docs/approval-agents
  title: PR Routing & Approval (Cursor docs, undated)
  kind: literature
  read: 2026-10-23
  claim: >-
    Approval policy lives in files; a PR that edits a policy file is judged by the base branch's
    version, failing closed to a human; only exact basenames are trusted.
- id: S-15
  url: https://sketch.dev/blog/agent-loop
  title: The Unreasonable Effectiveness of an LLM Agent Loop with Tool Use (Philip Zeyliger; sketch.dev, 2025-05-15)
  kind: literature
  read: 2026-10-23
  claim: A nine-line loop with one bash tool solves many coding tasks; specialised tools add reliability.

