  title: "Introducing SWE-bench Verified (OpenAI; 2024-08-13, updated 2025-02-24)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Practice. Three developers screened each of 1,699 samples; 68.3% were dropped as
    underspecified or wrongly tested, leaving 500. A broken benchmark understates the agent.

- id: S-35
  url: https://arxiv.org/abs/2605.27922
  title: "Harness-Bench: Evaluating Agent Harnesses across Models and Realistic Workflows (Yao et al.; 2026-05, v2 2026-10)"
  kind: literature
  read: 2026-11-27
  claim: >-
    New. 7 harnesses × 10 models on the same isolated tasks, one run each: the within-model spread
    is 5.0 to 9.5 points for nine models and 39.2 for one, and no harness is best on every model;
    one harness cost 2.97x another for a lower score. Its abstract and body disagree on the task
