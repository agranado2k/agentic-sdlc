# --- Literature survey (phase 1), by sub-question ---

# SQ1 · Evidence gates
- id: S-25
  url: https://www.artima.com/weblogs/viewpost.jsp?thread=210575
  title: "Pardon My French, But This Code Is C.R.A.P. (2) (Alberto Savoia, Artima, 2007-07-19)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Canon. Defines CRAP(m) = comp(m)² × (1 − cov(m)/100)³ + comp(m) to flag complex, untested
    methods first; the author warns it is "not perfect" and not a proxy for code quality.

- id: S-26
  url: https://research.google/pubs/state-of-mutation-testing-at-google/
  title: "State of Mutation Testing at Google (Petrović, Ivanković; ICSE-SEIP 2018)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Canon, abstract only (the PDF was not extractable). Diff-scoped, probabilistic mutation on
    covered, non-"arid" changed lines makes mutation testing viable in code review: about 30% of
    diffs with coverage, 6,000 engineers. "Traditional mutation analysis is computationally
    prohibitive".

- id: S-27
  url: https://www.cs.tufts.edu/~nr/cs257/archive/john-hughes/quick.pdf
  title: "QuickCheck: a lightweight tool for random testing of Haskell programs (Claessen, Hughes; ICFP 2000)"
  kind: literature
  claim: >-
    Unread: the PDF came back as binary with no extractable text. Cited by S-29 as the origin of
    property-based testing.

- id: S-28
  url: https://arxiv.org/abs/2501.12862
  title: "Mutation-Guided LLM-based Test Generation at Meta (Foster, Harman et al.; FSE Companion 2025)"
  kind: literature
  read: 2026-11-27
  claim: >-
    New. An LLM writes mutants that current tests miss and a second LLM writes tests that kill
    them; an LLM equivalence filter reaches 0.95 precision with pre-processing. Engineers accepted
    73% of 191 tests. One model, Kotlin/Android, privacy faults only.

- id: S-29
  url: https://arxiv.org/abs/2510.09907
  title: "Agentic Property-Based Testing: Finding Bugs Across the Python Ecosystem (Maaz, DeVoe, Hatfield-Dodds, Carlini; 2025-10)"
  kind: literature
  read: 2026-11-27
  claim: >-
    New. A Claude Code agent writes Hypothesis tests and triages failures: 984 reports on 100
    packages, 56% valid by manual sample, 86% of the rubric's top 21; about $5,474 in all, about
    $10 a valid bug. The agent cannot tell intended design from a bug.

- id: S-30
  url: https://arxiv.org/abs/2307.04346
  title: "Can Large Language Models Write Good Property-Based Tests? (Vikram, Lemieux, Sunshine, Padhye; 2024-07)"
  kind: literature
  read: 2026-11-27
  claim: >-
    New. Only about a quarter of LLM-written property tests are both valid and sound, and they
    cover about 21% of documented properties; generated tests need a validity, soundness and
    property-mutant check before they count.

