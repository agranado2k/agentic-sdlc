# SQ3 · Guard and gate design
- id: S-36
  url: https://kubernetes.io/docs/concepts/security/pod-security-admission/
  title: "Pod Security Admission (Kubernetes docs)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Canon, partly through a summary. One policy runs per namespace in three independent modes:
    enforce rejects, audit logs, warn tells the user; the last two let the action through, so a
    policy can be watched before it blocks.

- id: S-37
  url: https://martinfowler.com/articles/feature-toggles.html
  title: "Feature Toggles (aka Feature Flags) (Pete Hodgson, martinfowler.com, 2017-10-09)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Canon, partly through a summary. Toggles differ by longevity and dynamism: canary cohorts, ops
    kill switches, expiry "time bombs" and a cap on their number. Silent on fail-open defaults.

- id: S-38
  url: https://code.claude.com/docs/en/hooks
  title: "Hooks reference (Claude Code docs)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Practice, partly read. Exit 2 blocks; a crashed, invalid or timed-out hook fails open unless it
    sets `onFailure: "block"` (v2.1.295 or later); a Stop hook that exits 2 keeps the turn going;
    managed settings can allow only managed hooks.

- id: S-39
  url: https://arxiv.org/abs/2506.08837
  title: "Design Patterns for Securing LLM Agents against Prompt Injections (Beurer-Kellner, Tramèr et al.; 2025-06)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Canon. Six patterns (action-selector, plan-then-execute, map-reduce, dual LLM,
    code-then-execute, context-minimisation) constrain an agent once it has read untrusted input;
    qualitative, and "they do not provide guarantees" for heuristic defences.

- id: S-40
  url: https://arxiv.org/abs/2503.18813
  title: "Defeating Prompt Injections by Design (CaMeL; Debenedetti, Tramèr et al.; Google DeepMind, ETH; 2025)"
  kind: literature
  read: 2026-11-27
  claim: >-
    New. A privileged planner, a tool-less quarantined reader and an interpreter that tracks each
    value's provenance and checks policies before every tool call: 77% of AgentDojo tasks with
    provable security against 84% undefended, at about 2.8x tokens.

# SQ4 · Run reliability
- id: S-41
  url: https://stripe.com/blog/idempotency
  title: "Designing robust and predictable APIs with idempotency (Brandur Leach, Stripe, 2017-02-22)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Canon. An idempotency key sent with every retry lets the server return the stored result instead
    of repeating a side effect; backoff with jitter avoids synchronised retries.

- id: S-42
  url: https://sre.google/sre-book/addressing-cascading-failures/
  title: "Addressing Cascading Failures (Mike Ulrich, Google SRE book, 2017)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Canon, partly through a summary. Retry at one layer only (4 attempts over 3 layers is 64),
    cap retries per request and per process, propagate one absolute deadline, and cancel doomed
    work.

- id: S-43
  url: https://temporal.io/blog/durable-execution-meets-ai-why-temporal-is-the-perfect-foundation-for-ai
  title: "Durable Execution meets AI (Cornelia Davis, Temporal, 2025-07-10)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Practice, vendor. Every step's result is recorded and state is rebuilt by replaying the event
    history after a crash; LLM and tool calls retry automatically as activities. Silent on
    idempotency of side effects.

- id: S-44
  url: https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents
  title: "Effective harnesses for long-running agents (Justin Young, Anthropic, 2025-11-26)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Practice. An initializer session writes a progress file and a first commit; each later session
    reads them, runs a basic end-to-end check, makes one feature of progress and commits a clean
    state. Qualitative only.

- id: S-45
  url: https://docs.langchain.com/oss/python/langgraph/durable-execution
  title: "Persistence (LangGraph docs; the URL served this page, not durable execution)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Practice, partly on-topic. Checkpointers save a thread's state for resume; in-memory savers lose
    it on restart; checkpoints accumulate cost. Silent on side effects during replay.

# SQ5 · Cost inside the harness
- id: S-46
  url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
  title: "Effective context engineering for AI agents (Anthropic, 2025-09-29)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Canon. Context is a finite attention budget: compaction, notes outside the window, just-in-time
    retrieval, sub-agents that return 1,000 to 2,000 tokens. No measurements.

- id: S-47
  url: https://research.trychroma.com/context-rot
  title: "Context Rot: How Increasing Input Tokens Impacts LLM Performance (Hong, Troynikov, Huber; Chroma, 2025-07-14)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Dissent. Across 18 models, accuracy falls as input grows even on simple tasks; a focused
    300-token prompt beat the full 113k-token one for every model family (LongMemEval, 306 prompts).

- id: S-48
  url: https://manus.im/blog/Context-Engineering-for-AI-Agents-Lessons-from-Building-Manus
  title: "Context Engineering for AI Agents: Lessons from Building Manus (Yichao Ji, Manus, 2025-07-18)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Practice, vendor. KV-cache hit rate is the top production metric: a stable prefix, append-only
    context, tools masked rather than removed, files as memory, failures kept in context. Cached
    input at a tenth of the price; about 100:1 input to output.

- id: S-49
  url: https://www.anthropic.com/engineering/writing-tools-for-agents
  title: "Writing effective tools for AI agents — with agents (Anthropic, 2025-09-11)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Practice. Consolidated, namespaced tools with concise response modes, truncation and actionable
    errors cut the context each call spends; tune them on held-out tasks. One example: 206 tokens
    down to 72.

- id: S-50
  url: https://docs.claude.com/en/docs/build-with-claude/prompt-caching
  title: "Prompt caching (Anthropic API docs)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Canon. A byte-identical prefix (tools, system, messages) is read at about 0.1x the input price,
    written at 1.25x for 5 minutes or 2x for an hour; any change invalidates its level and all after
    it.

