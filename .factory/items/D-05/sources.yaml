# --- The operator's pasted text (notes/claude-code-verification.md) ---

- id: S-14
  url: https://claude.dev/blog/how-the-claude-code-team-thinks-about-verification/
  title: "How the Claude Code team thinks about verification (Addy Osmani, claude.dev, 2026-11-16)"
  kind: operator
  read: 2026-11-27
  copy: notes/claude-code-verification.md
  claim: >-
    The operator's copy matches the published article on eleven checkpoints. Verification loops
    let one person run many agents; one reviewer tuned over rounds beats a stacked second one;
    rules read from the base branch; three failing rounds bring a human; new gates start in observe
    mode with a two-block escape; every commit stamped with how it was verified; reviewers graded
    by reverts, incident replays and per-stage recall; misses become rules only past a bar.
    Internal: a rubric grader added up to 10 points of task success.

