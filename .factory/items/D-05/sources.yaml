  kind: literature
  read: 2026-11-27
  claim: >-
    Canon. Merged PRs become tasks graded by their hidden fail-to-pass and pass-to-pass tests; a
    benchmark measures model and scaffold together. Passing tests does not guarantee good code.

- id: S-32
  url: https://arxiv.org/abs/2405.15793
  title: "SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering (Yang et al.; 2024)"
  kind: literature
  read: 2026-11-27
  claim: >-
    Canon. The interface alone moved GPT-4 Turbo from 11.0% to 18.0% on SWE-bench Lite (n=300);
    a lint guardrail on edits, capped search and a 100-line viewer each mattered in ablation. About
